name: Secrets

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets passed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: bash scripts/ci/install-security-tools.sh gitleaks "$RUNNER_TEMP/security-tools"
      - name: Check Git history for credentials
        run: |
          mkdir -p build/reports/security
          "$RUNNER_TEMP/security-tools/gitleaks" git --redact --no-banner \
            --report-format=json --report-path=build/reports/security/gitleaks.json .
      - name: Upload redacted scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: secrets-report
          path: build/reports/security/gitleaks.json
          retention-days: 14

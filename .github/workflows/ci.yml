name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Workflow and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Lint GitHub Actions
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Check whitespace
        run: git show --format= --check --diff-merges=first-parent HEAD

  build:
    name: Build and tests / Java ${{ matrix.java }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    env:
      YDB_TEST_CONNECTION: grpc://localhost:2136/local
      TEST_JAVA: ${{ matrix.java }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic
      - name: Start YDB
        run: docker compose up -d --wait --wait-timeout 180
      - name: Build, Javadoc, unit and integration tests
        run: ./gradlew --no-daemon --console=plain --stacktrace clean build -PtestJava="$TEST_JAVA"
      - name: Require complete test reports
        run: python3 scripts/ci/check-test-results.py
      - name: Publish artifacts for consumer tests
        if: matrix.java == '17'
        run: ./gradlew --no-daemon --console=plain --stacktrace publishAllPublicationsToBuildRepositoryRepository
      - name: Upload Maven repository
        if: matrix.java == '17'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maven-repository
          path: build/repository
          if-no-files-found: error
          retention-days: 7
      - name: Collect YDB logs
        if: always()
        run: |
          mkdir -p build/ci
          docker compose logs --no-color > build/ci/ydb.log 2>&1
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tests-java-${{ matrix.java }}
          path: |
            ydb-*/build/reports/tests/
            ydb-*/build/test-results/test/*.xml
            build/ci/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop YDB
        if: always()
        run: docker compose down --volumes --remove-orphans

  consumer:
    name: Consumers / Java ${{ matrix.java }} / Boot ${{ matrix.boot }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        boot: ['4.0.8', '4.1.1']
    env:
      RUNTIME_JAVA: ${{ matrix.java }}
      BOOT_VERSION: ${{ matrix.boot }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: samples/minimal/pom.xml
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-repository
          path: build/repository
      - name: Start YDB
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify Gradle consumer commit and rollback
        run: |
          mkdir -p build/ci
          ./gradlew --no-daemon --console=plain --stacktrace -p samples/minimal run \
            -PruntimeJava="$RUNTIME_JAVA" -PbootVersion="$BOOT_VERSION" 2>&1 | tee build/ci/gradle-consumer.log
      - name: Verify Maven consumer commit and rollback
        run: |
          mkdir -p build/ci
          mvn -B -ntp -U -f samples/minimal/pom.xml -Dboot.version="$BOOT_VERSION" \
            compile exec:java 2>&1 | tee build/ci/maven-consumer.log
      - name: Collect YDB logs
        if: always()
        run: |
          mkdir -p build/ci
          docker compose logs --no-color > build/ci/ydb.log 2>&1
      - name: Upload consumer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumers-java-${{ matrix.java }}-boot-${{ matrix.boot }}
          path: build/ci/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop YDB
        if: always()
        run: docker compose down --volumes --remove-orphans

  ci:
    name: CI passed
    if: always()
    needs: [checks, build, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      CONSUMER_RESULT: ${{ needs.consumer.result }}
    steps:
      - name: Require every job to succeed
        run: |
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$CONSUMER_RESULT" = success

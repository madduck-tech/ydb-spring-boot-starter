name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated release tag already tested by CI (for example v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag ancestry and successful CI
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/verify-release.py

  dependencies:
    needs: verify
    uses: ./.github/workflows/dependencies.yml
    with:
      revision: ${{ needs.verify.outputs.commit }}

  secrets:
    needs: verify
    uses: ./.github/workflows/secrets.yml
    with:
      revision: ${{ needs.verify.outputs.commit }}

  publish:
    name: Publish and consume packages
    needs: [verify, dependencies, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PACKAGE_REPOSITORY: https://maven.pkg.github.com/madduck-tech/ydb-spring-boot-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          server-id: starter-build
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Match published coordinates to the tag
        run: ./gradlew --no-daemon --console=plain verifyReleaseVersion
      - name: Publish all three modules to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon --console=plain --stacktrace publishAllPublicationsToGitHubPackagesRepository
      - name: Start YDB for registry consumer checks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Consume from GitHub Packages with Gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci
          ./gradlew --no-daemon --console=plain --refresh-dependencies -p samples/minimal \
            -PstarterRepository="$PACKAGE_REPOSITORY" run 2>&1 | tee build/ci/gradle-registry-consumer.log
      - name: Consume from GitHub Packages with Maven
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci
          mvn -B -ntp -f samples/minimal/pom.xml -Dstarter.repository.url="$PACKAGE_REPOSITORY" \
            -Dmaven.repo.local="$RUNNER_TEMP/maven-registry-consumer" \
            compile exec:java 2>&1 | tee build/ci/maven-registry-consumer.log
      - name: Collect YDB logs
        if: always()
        run: |
          mkdir -p build/ci
          docker compose logs --no-color > build/ci/ydb.log 2>&1
      - name: Upload registry consumer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: registry-consumer-logs
          path: build/ci/
          retention-days: 14
      - name: Stop YDB
        if: always()
        run: docker compose down --volumes --remove-orphans
